name: Deploy & Verify ZOFIA V3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenZeppelin v4.9.6
        run: npm install @openzeppelin/contracts@4.9.6

      - name: Prepare contract files
        run: |
          mkdir -p src
          cp contracts/ZOFIA.sol src/

      - name: Set up remappings
        run: echo "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" > remappings.txt

      - name: Build contract
        run: forge build

      - name: Deploy to Ethereum
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          forge create --rpc-url https://ethereum.publicnode.com \
            --private-key $PRIVATE_KEY \
            src/ZOFIA.sol:ZOFIA \
            --gas-price 1gwei \
            --gas-limit 2500000 \
            --broadcast

      - name: Mint 50 Trillion ZOFIA
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RECIPIENT: ${{ secrets.RECIPIENT_ADDRESS }}
        run: |
          AMOUNT="50000000000000000000000000000000"
          echo "Minting $AMOUNT ZOFIA to $RECIPIENT..."
          cast send ${{ secrets.CONTRACT_ADDRESS }} \
            "mintForMigration(address,uint256)" \
            $RECIPIENT $AMOUNT \
            --private-key $PRIVATE_KEY \
            --rpc-url https://ethereum.publicnode.com \
            --gas-limit 2000000

      - name: Verify Contract on Etherscan
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          forge verify-contract \
            ${{ secrets.CONTRACT_ADDRESS }} \
            src/ZOFIA.sol:ZOFIA \
            --chain-id 1 \
            --verifier etherscan \
            --verifier-url "https://api.etherscan.io/v2/api?chainid=1" \
            --etherscan-api-key $ETHERSCAN_API_KEY \
            --watch

      - name: Print result
        run: |
          echo "✅ ZOFIA V3 deployed and verified!"
          echo "🔗 Contract: https://etherscan.io/address/${{ secrets.CONTRACT_ADDRESS }}"
