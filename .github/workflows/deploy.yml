name: Deploy ZOFIA to Ethereum

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --save-dev hardhat @nomicfoundation/hardhat-toolbox dotenv

      - name: Create .env file
        run: echo "PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}" > .env

      - name: Compile contracts
        run: npx hardhat compile

      - name: Deploy to Ethereum
        run: npx hardhat run scripts/deploy.js --network ethereum
