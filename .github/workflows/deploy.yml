name: Deploy ZOFIA to Ethereum

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Create src directory and copy contract
        run: |
          mkdir -p src
          cp contracts/ZOFIA.sol src/

      - name: Install OpenZeppelin
        run: forge install OpenZeppelin/openzeppelin-contracts

      - name: Create remappings.txt
        run: echo "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/" > remappings.txt

      - name: Deploy to Ethereum
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          forge create --rpc-url https://ethereum.publicnode.com \
            --private-key $PRIVATE_KEY \
            src/ZOFIA.sol:ZOFIA \
            --constructor-args $(cast wallet address --private-key $PRIVATE_KEY) \
            --gas-price 1gwei
