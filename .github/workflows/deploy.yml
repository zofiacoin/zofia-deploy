name: Mint & Verify ZOFIA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenZeppelin v4.9.6
        run: npm install @openzeppelin/contracts@4.9.6

      - name: Prepare contract files
        run: |
          mkdir -p src
          cp contracts/ZOFIA.sol src/

      - name: Set up remappings
        run: echo "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" > remappings.txt

      - name: Build contract
        run: forge build

      # ========== الدفعة الأولى: 25 تريليون ZOFIA ==========
      - name: Mint Batch 1 - 25 Trillion ZOFIA
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RECIPIENT: ${{ secrets.RECIPIENT_ADDRESS }}
        run: |
          # 25,000,000,000,000 * 10^18 = 25000000000000000000000000000000
          AMOUNT="25000000000000000000000000000000"
          echo "Minting $AMOUNT ZOFIA to $RECIPIENT (Batch 1: 25 Trillion)..."
          cast send ${{ secrets.CONTRACT_ADDRESS }} \
            "mintForMigration(address,uint256)" \
            $RECIPIENT $AMOUNT \
            --private-key $PRIVATE_KEY \
            --rpc-url https://ethereum.publicnode.com \
            --gas-limit 4000000

      # ========== الدفعة الثانية: 25 تريليون ZOFIA ==========
      - name: Mint Batch 2 - 25 Trillion ZOFIA
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          RECIPIENT: ${{ secrets.RECIPIENT_ADDRESS }}
        run: |
          AMOUNT="25000000000000000000000000000000"
          echo "Minting $AMOUNT ZOFIA to $RECIPIENT (Batch 2: 25 Trillion)..."
          cast send ${{ secrets.CONTRACT_ADDRESS }} \
            "mintForMigration(address,uint256)" \
            $RECIPIENT $AMOUNT \
            --private-key $PRIVATE_KEY \
            --rpc-url https://ethereum.publicnode.com \
            --gas-limit 4000000

      # ========== توثيق العقد على Etherscan ==========
      - name: Verify Contract on Etherscan
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          forge verify-contract \
            ${{ secrets.CONTRACT_ADDRESS }} \
            src/ZOFIA.sol:ZOFIA \
            --chain-id 1 \
            --verifier etherscan \
            --verifier-url "https://api.etherscan.io/v2/api?chainid=1" \
            --etherscan-api-key $ETHERSCAN_API_KEY \
            --watch

      - name: Print result
        run: |
          echo "✅ 50 Trillion ZOFIA minted successfully!"
          echo "🔗 Check your balance: https://etherscan.io/address/${{ secrets.RECIPIENT_ADDRESS }}"
          echo "🔗 Verified contract: https://etherscan.io/address/${{ secrets.CONTRACT_ADDRESS }}#code"
