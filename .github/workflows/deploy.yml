name: Deploy ZOFIA to Ethereum

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenZeppelin v4.9.6
        run: npm install @openzeppelin/contracts@4.9.6

      - name: Prepare contract files
        run: |
          mkdir -p src
          cp contracts/ZOFIA.sol src/

      - name: Set up remappings
        run: echo "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/" > remappings.txt

      - name: Build contract
        run: forge build

      - name: Deploy to Ethereum
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          forge create --rpc-url https://ethereum.publicnode.com \
            --private-key $PRIVATE_KEY \
            src/ZOFIA.sol:ZOFIA \
            --gas-price 1gwei

      - name: Print contract address
        run: |
          echo "✅ Contract deployed successfully!"
          echo "🔗 Check on Etherscan: https://etherscan.io/address/$(cat out/ZOFIA.sol/ZOFIA.json | jq -r '.address')"
